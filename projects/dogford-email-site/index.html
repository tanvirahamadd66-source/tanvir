<!doctype html>
<html lang="en" data-scrollbar-custom="1">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dogford — Premium Dog Food Email Design</title>
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ scrollbar-width:thin; scrollbar-color:rgba(0,0,0,0.2) transparent; }
  html::-webkit-scrollbar{ width:9px; }
  html::-webkit-scrollbar-track{ background:#fff; }
  html::-webkit-scrollbar-thumb{ background:rgba(0,0,0,0.2); border-radius:8px; }
  html::-webkit-scrollbar-thumb:hover{ background:rgba(0,0,0,0.35); }
  html,body{ background:#fff; min-height:100%; }
  .frame{ width:100%; }
  img{ display:block; width:100%; height:auto; }
</style>
</head>
<body>
<div class="frame">
  <img src="../../assets/img/projects/behance/dogford-email-design/full-design.jpg" alt="Dogford — Premium Dog Food Email Design" />
</div>

<script>
(function(){
  // Auto-play mode for the portfolio thumbnail/preview card: activated only
  // via ?showcase=1 on the URL (never affects a normal visit to this file).
  // Loops a slow scroll down through the design and back so the embedded
  // preview looks like it's genuinely being read.
  var params = new URLSearchParams(location.search);
  if(params.get('showcase') !== '1') return;
  document.documentElement.style.scrollbarWidth = 'none';
  // Card-sized version of the design: the full-res file is 1600px wide and ~10,000px
  // tall (~16MP, ~65MB once decoded) — far more than a ~400px thumbnail needs, and
  // enough on its own to push phones into out-of-memory tab crashes.
  var previewImg = document.querySelector('.frame img');
  if (previewImg) previewImg.src = previewImg.getAttribute('src').replace('full-design.jpg', 'full-design-preview.jpg');

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce) return;

  function smoothScrollTo(y, duration){
    return new Promise(function(resolve){
      var startY = window.scrollY, distance = y - startY, startTime = null;
      function step(ts){
        if(!startTime) startTime = ts;
        var t = Math.min(1, (ts - startTime) / duration);
        var eased = t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
        window.scrollTo(0, startY + distance * eased);
        if(t < 1) requestAnimationFrame(step); else resolve();
      }
      requestAnimationFrame(step);
    });
  }
  function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

  // The portfolio page pauses/resumes this loop via postMessage whenever the card
  // leaves/enters the viewport (see initLivePreviewLifecycle in js/main.js), so
  // off-screen previews stop scrolling/repainting instead of running forever.
  var paused = false, resumeWaiters = [];
  window.addEventListener('message', function (e) {
    if (e.source !== window.parent || !e.data || typeof e.data.showcase !== 'string') return;
    paused = e.data.showcase === 'pause';
    if (!paused) resumeWaiters.splice(0).forEach(function (r) { r(); });
  });
  function whenPlaying() { return paused ? new Promise(function (r) { resumeWaiters.push(r); }) : Promise.resolve(); }

  function loop(){
    var maxY = document.documentElement.scrollHeight - window.innerHeight;
    wait(500)
      .then(function(){ return smoothScrollTo(maxY, 6000); })
      .then(function(){ return wait(1000); })
      .then(function(){ return smoothScrollTo(0, 3000); })
      .then(function(){ return wait(700); })
      .then(whenPlaying)
      .then(loop);
  }
  window.addEventListener('load', function(){ setTimeout(loop, 300); });
})();
</script>
</body>
</html>
